services:
    docker-proxy:
        image: tecnativa/docker-socket-proxy:0.3.0
        restart: unless-stopped
        environment:
            CONTAINERS: 1
            IMAGES: 1
            VOLUMES: 1
            NETWORKS: 1
            INFO: 1
            PING: 1
            VERSION: 1
            POST: 1
            DELETE: 1
            EXEC: 1
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /run

    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        image: oj-server:latest
        restart: unless-stopped
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            JWT_SECRET: ${JWT_SECRET}
            CORS_ORIGIN: ${CORS_ORIGIN}
            PORT: 3000
            DATA_DIR: /app/data
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
            COOKIE_SECURE: ${COOKIE_SECURE:-true}
            COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
            COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
            TRUST_PROXY: ${TRUST_PROXY:-true}
            JWT_SECRET_MIN_LENGTH: ${JWT_SECRET_MIN_LENGTH:-32}
            MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-2097152}
            MAX_CODE_SIZE: ${MAX_CODE_SIZE:-100000}
            MAX_RUN_INPUT_SIZE: ${MAX_RUN_INPUT_SIZE:-50000}
            MAX_STATEMENT_SIZE: ${MAX_STATEMENT_SIZE:-200000}
            MAX_SAMPLE_SIZE: ${MAX_SAMPLE_SIZE:-50000}
            MAX_TESTCASE_SIZE: ${MAX_TESTCASE_SIZE:-200000}
            MAX_TEXT_ANSWER_SIZE: ${MAX_TEXT_ANSWER_SIZE:-50000}
            MAX_GENERATOR_CODE_SIZE: ${MAX_GENERATOR_CODE_SIZE:-100000}
            MAX_SOLUTION_CODE_SIZE: ${MAX_SOLUTION_CODE_SIZE:-100000}
            MAX_PROBLEM_TITLE_LENGTH: ${MAX_PROBLEM_TITLE_LENGTH:-120}
            MAX_CONTEST_TITLE_LENGTH: ${MAX_CONTEST_TITLE_LENGTH:-120}
            MAX_USERNAME_LENGTH: ${MAX_USERNAME_LENGTH:-32}
            MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-8}
            MAX_PASSWORD_LENGTH: ${MAX_PASSWORD_LENGTH:-128}
            MAX_TIME_LIMIT_MS: ${MAX_TIME_LIMIT_MS:-10000}
            MAX_MEMORY_LIMIT_MB: ${MAX_MEMORY_LIMIT_MB:-512}
            MAX_TESTCASE_COUNT: ${MAX_TESTCASE_COUNT:-200}
            RUN_WAIT_TIMEOUT_MS: ${RUN_WAIT_TIMEOUT_MS:-60000}
            RUN_QUEUE_NAME: ${RUN_QUEUE_NAME:-run-queue}
            JUDGE_QUEUE_NAME: ${JUDGE_QUEUE_NAME:-submission-queue}
        ports:
            - "${SERVER_BIND_IP:-127.0.0.1}:3000:3000"
        volumes:
            - ${DATA_DIR_HOST:-/srv/oj/data}:/app/data
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true

    worker:
        build:
            context: .
            dockerfile: worker/Dockerfile
        image: oj-worker:latest
        restart: unless-stopped
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            JUDGE_IMAGE: ${JUDGE_IMAGE:-oj-runner:latest}
            JUDGE_IMAGE_ALLOWLIST: ${JUDGE_IMAGE_ALLOWLIST:-oj-runner:latest}
            RUN_WORKER_CONCURRENCY: ${RUN_WORKER_CONCURRENCY:-2}
            JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-4}
            RUN_QUEUE_NAME: ${RUN_QUEUE_NAME:-run-queue}
            JUDGE_QUEUE_NAME: ${JUDGE_QUEUE_NAME:-submission-queue}
            DATA_DIR: /app/data
            MAX_TIME_LIMIT_MS: ${MAX_TIME_LIMIT_MS:-10000}
            MAX_MEMORY_LIMIT_MB: ${MAX_MEMORY_LIMIT_MB:-512}
            MAX_TESTCASE_COUNT: ${MAX_TESTCASE_COUNT:-200}
            MAX_GENERATED_TESTCASE_COUNT: ${MAX_GENERATED_TESTCASE_COUNT:-30}
            COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-20000}
            COMPILE_MEMORY_LIMIT_MB: ${COMPILE_MEMORY_LIMIT_MB:-1024}
            SANDBOX_VOLUME_SIZE_MB: ${SANDBOX_VOLUME_SIZE_MB:-256}
            SANDBOX_MAX_FILE_BYTES: ${SANDBOX_MAX_FILE_BYTES:-16777216}
            SANDBOX_ALLOW_UNLIMITED_VOLUME_FALLBACK: ${SANDBOX_ALLOW_UNLIMITED_VOLUME_FALLBACK:-false}
            SANDBOX_USE_TMPFS: ${SANDBOX_USE_TMPFS:-false}
            DOCKER_HOST: tcp://docker-proxy:2375
        depends_on:
            docker-proxy:
                condition: service_started
        volumes:
            - ${DATA_DIR_HOST:-/srv/oj/data}:/app/data
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
