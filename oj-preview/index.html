첫째 줄에 입력에 대한 **최소공배수??** 를 출력한다.

### 정답 코드 (C99)

```c
#include <stdio.h>
#include <string.h>
int main(void)
{
    int i, j, max, result=0, len; char arr[1000000];
    int cnt[26] = {0, };
    int select = 0;
    scanf("%s", arr);
    len = strlen(arr);
    for(i = 'a'; i <= 'z'; i++) 
    {
        for(j = 0; j < len; j++)
        {
            if(i == arr[j])
                cnt[i-'a']++;
        }
    }
    for(i = 'A'; i <= 'Z'; i++)
    {
        for(j = 0; j < len; j++)
        {
            if(i == arr[j])
                cnt[i-'A']++;
        }
    }
    max = cnt[0];
    for(i = 1; i < 26; i++)
    {
        if(max < cnt[i])
        {
            max = cnt[i];
            select = i;
        }
    }
    for(i = 0; i < 26; i++)
    {
        if(max == cnt[i])
            result++;
    }
    if(result > 1)
        printf("?\n");
    else
        printf("%c", select+65);
    return 0;
}
```

### 생성 코드 (CPP17)

```cpp
#include <iostream>
#include <string>
#include <cstdio>
#include <cstdlib>
#include <chrono>

using namespace std;

static const int MIN_LEN = 1;
static const int MAX_LEN = 12; // 필요 시 1000, 1000000 등으로 변경

struct SplitMix64
{
    unsigned long long x;

    explicit SplitMix64(unsigned long long seed) : x(seed) {}

    unsigned long long NextU64()
    {
        unsigned long long z = (x += 0x9e3779b97f4a7c15ULL);
        z = (z ^ (z >> 30)) * 0xbf58476d1ce4e5b9ULL;
        z = (z ^ (z >> 27)) * 0x94d049bb133111ebULL;
        return z ^ (z >> 31);
    }

    unsigned int NextU32()
    {
        return (unsigned int)(NextU64() >> 32);
    }

    unsigned int Bounded(unsigned int bound)
    {
        // [0, bound)  (bound > 0)
        return (unsigned int)(((unsigned long long)NextU32() * (unsigned long long)bound) >> 32);
    }

    int NextInt(int lo, int hi)
    {
        unsigned int span = (unsigned int)(hi - lo + 1);
        return lo + (int)Bounded(span);
    }

    bool Chance(double p)
    {
        // p in [0,1]
        // 32-bit 임계값 비교
        unsigned long long threshold = (unsigned long long)(p * 4294967296.0); // 2^32
        return (unsigned long long)NextU32() < threshold;
    }
};

static inline char RandomLetter(SplitMix64 &rng, bool upper)
{
    int v = rng.NextInt(0, 25);
    return upper ? (char)('A' + v) : (char)('a' + v);
}

static inline bool RandomCase(SplitMix64 &rng)
{
    return (rng.NextU32() & 1U) != 0;
}

static void ShuffleString(string &s, SplitMix64 &rng)
{
    // Fisher–Yates
    for (int i = (int)s.size() - 1; i > 0; i--)
    {
        int j = (int)rng.Bounded((unsigned int)(i + 1));
        char tmp = s[(size_t)i];
        s[(size_t)i] = s[(size_t)j];
        s[(size_t)j] = tmp;
    }
}

static string generate_uniform_word(int length, SplitMix64 &rng)
{
    string word;
    word.resize((size_t)length);

    for (int i = 0; i < length; i++)
    {
        bool upper = RandomCase(rng);
        word[(size_t)i] = RandomLetter(rng, upper);
    }
    return word;
}

static string generate_single_dominating(int length, SplitMix64 &rng)
{
    if (length <= 0)
    {
        return string();
    }

    string word;
    word.resize((size_t)length);

    char dominantLower = (char)('a' + rng.NextInt(0, 25));
    char dominantUpper = (char)('A' + (dominantLower - 'a'));

    // "절반 초과" 보장: [length/2 + 1, length]
    int minDom = length / 2 + 1;
    int dominant_freq = (minDom <= length) ? rng.NextInt(minDom, length) : length;

    int idx = 0;

    for (; idx < dominant_freq; idx++)
    {
        word[(size_t)idx] = RandomCase(rng) ? dominantUpper : dominantLower;
    }

    for (; idx < length; idx++)
    {
        bool upper = RandomCase(rng);
        word[(size_t)idx] = RandomLetter(rng, upper);
    }

    ShuffleString(word, rng);
    return word;
}

static string generate_tie_word(int length, SplitMix64 &rng)
{
    char first_lower = (char)('a' + rng.NextInt(0, 25));
    char second_lower = (char)('a' + rng.NextInt(0, 25));
    while (second_lower == first_lower)
    {
        second_lower = (char)('a' + rng.NextInt(0, 25));
    }

    // 원 코드와 동일: 홀수면 1 늘려서 짝수로
    if (length & 1)
    {
        length += 1;
    }

    string word;
    word.resize((size_t)length);

    char first_upper = (char)('A' + (first_lower - 'a'));
    char second_upper = (char)('A' + (second_lower - 'a'));

    int half = length / 2;

    for (int i = 0; i < half; i++)
    {
        word[(size_t)i] = RandomCase(rng) ? first_upper : first_lower;
    }
    for (int i = half; i < length; i++)
    {
        word[(size_t)i] = RandomCase(rng) ? second_upper : second_lower;
    }

    ShuffleString(word, rng);
    return word;
}

static string generate_completely_random_word(int length, SplitMix64 &rng)
{
    // 원 코드와 동일하게 구현(사실상 uniform과 동일)
    string word;
    word.resize((size_t)length);

    for (int i = 0; i < length; i++)
    {
        bool upper = RandomCase(rng);
        word[(size_t)i] = RandomLetter(rng, upper);
    }
    return word;
}

int main(int argc, char* argv[])

{
    ios::sync_with_stdio(false);
    cin.tie(nullptr);
    cout.tie(nullptr);

    unsigned long long seed =
        (unsigned long long)chrono::high_resolution_clock::now().time_since_epoch().count();

    if (argc >= 2)
    {
        seed = strtoull(argv[1], nullptr, 10);
    }

    SplitMix64 rng(seed);

    int test_type = rng.NextInt(0, 3);
    int length = rng.NextInt(MIN_LEN, MAX_LEN);

    // 원 코드 의도대로 20% 확률로 더 큰 length (단, MAX_LEN < 500일 때만)
    if (MAX_LEN < 500 && rng.Chance(0.2))
    {
        length = rng.NextInt(MAX_LEN + 1, 500);
    }

    string test_case;

    if (test_type == 0)
    {
        test_case = generate_uniform_word(length, rng);
    }
    else if (test_type == 1)
    {
        test_case = generate_single_dominating(length, rng);
    }
    else if (test_type == 2)
    {
        test_case = generate_tie_word(length, rng);
    }
    else
    {
        test_case = generate_completely_random_word(length, rng);
    }

    // 빠른 출력
    fwrite(test_case.data(), 1, test_case.size(), stdout);
    fputc('\n', stdout);

    return 0;
}
```

        <template data-problem="4" data-md="problem">
지완이는 점프를 매우 잘한다. 세상에서 점프를 제일 잘하는 사람인 **점프의 제왕**이 되기 위해 지완이는 다음의 테스트를 통과해야한다.

$1.$ 지완이는 가로와 세로의 칸 수가 같은 정사각형의 구역 내부에서만 움직일 수 있다. 지완이가 정사각형 구역의 외부로 나가는 경우엔 바닥으로 떨어져 즉시 테스트에서 탈락하게 된다.

$2.$ 지완이의 출발점은 항상 정사각형의 가장 왼쪽, 가장 위의 칸이다. 다른 출발점에서는 출발하지 않는다.

$3.$ 지완이가 이동 가능한 방향은 오른쪽과 아래 뿐이다. 위쪽과 왼쪽으로는 이동할 수 없다.

$4.$ 지완이가 가장 오른쪽, 가장 아래 칸에 도달하는 순간, 그 즉시 테스트를 통과한다.

$5.$ 지완이가 한 번에 이동할 수 있는 칸의 수는, 현재 밟고 있는 칸에 쓰여 있는 수 만큼이다. 칸에 쓰여 있는 수 초과나 그 미만으로 이동할 수 없다.

지완이는 계속 테스트를 진행해 마침내 최종 단계에 도달했다. 하지만 테스트를 진행하는 구역이 너무 넓어져버린 나머지, 통과할 수 있는지 없는지 가늠할 수 없어졌다. 지완이는 당신에게 주어진 구역에서 테스트를 통과할 수 있는지 알아봐 달라고 부탁했다. 지완이가 마지막 테스트를 통과하고 **점프의 제왕**이 될 수 있는지 알아보자.

### 입력
첫째 줄에는 테스트 구역의 크기 $N (2 ≤ N ≤ 3)$이 주어진다.

둘째 줄부터 마지막 줄까지 테스트 구역(맵)이 주어진다.

맵의 통과 지점(오른쪽 맨 아래 칸)에는 $-1$이 쓰여있고, 나머지 칸에는 $0$ 이상 $100$ 이하의 정수가 쓰여있다.

#include <iostream>
#include <queue>
#define f first
#define s second

int map[3][3];
int n;

string dfs()
{
	queue<pair<int, int>>v;
	v.push(make_pair(0, 0));
	int step;
	int x;
	int y;
	while (!v.empty())
	{
        auto t = v.front();
		x = t.f; y = t.s;
        v.pop();
		step = map[x][y];
		if (step == -1)
		{
			return "Happy";
		}
		if (step == 0) continue;

		if (x + step < n)
		{
			v.push(make_pair(x + step, y));
		}
		if (y + step < n)
		{
			v.push(make_pair(x, y + step));
		}
		
	}

	return "Sad";
}

int main()
{
	ios::sync_with_stdio(false);
	cin.tie(0);
	cout.tie(0);
	cin >> n;
	for (int i = 0; i < n; i++)
	{
		for (int j = 0; j < n; j++)
		{
			cin >> map[j][i];
		}
	}
	cout << dfs();

$ESC$ 나라와 $TOPS$ 나라는 전쟁을 하고 있다. 당신은 $ESC$ 나라에서 적군의 진영을 분석하는 일을 맡고 있다.

2차원 평면 위의 $N$곳에 $TOPS$ 나라의 진영이 설치되어 있다. 각 진영마다 하나의 통신탑을 설치해, $i$번째 통신탑은 설치 위치로부터 $R_i$ 이내 거리에 포함되는 모든 지역을 자신의 통신영역 $A_i$로 가지게 된다. 만약 임의의 통신영역 $A_i$와 $A_j$가 닿거나 겹치는 부분이 있다면 진영 $i$와 진영 $j$는 직접적으로 통신이 가능하다. 물론 직접적으로 통신이 가능하지 않더라도, 임의의 지역 $i$와 $j$가 중간에 몇 개의 직접통신을 거쳐서 최종적으로 통신이 가능하다면 $i$와 $j$는 통신이 가능한 것으로 본다.

$TOPS$ 나라의 군사들은 *영리*해서 통신이 가능한 부대끼리 결집력 있는 하나의 그룹처럼 행동한다. 당신은 이러한 그룹의 개수를 알아내야한다.

#include <iostream>
#include <vector>
#include <utility>
#include <algorithm>
#include <cstdint>
#include <cstdio>

using namespace std;

vector<int> link;
vector<int> linkSize;

class FastInput
{
private:
    static constexpr size_t BUFSZ = 1 << 20;
    char buf[BUFSZ];
    size_t idx;
    size_t sz;

public:
    FastInput() : idx(0), sz(0)
    {
    }

    inline char ReadChar()
    {
        if (idx >= sz)
        {
            sz = fread(buf, 1, BUFSZ, stdin);
            idx = 0;
            if (sz == 0)
            {
                return 0;
            }
        }
        return buf[idx++];
    }

    template <typename T>
    inline bool ReadInt(T& out)
    {
        char c;
        do
        {
            c = ReadChar();
            if (c == 0)
            {
                return false;
            }
        } while (c <= ' ');

        bool neg = false;
        if (c == '-')
        {
            neg = true;
            c = ReadChar();
        }

        T val = 0;
        while (c > ' ')
        {
            val = val * 10 + (c - '0');
            c = ReadChar();
        }

        out = neg ? -val : val;
        return true;
    }
};

class FastOutput
{
private:
    static constexpr size_t BUFSZ = 1 << 20;
    char buf[BUFSZ];
    size_t idx;

public:
    FastOutput() : idx(0)
    {
    }

    ~FastOutput()
    {
        Flush();
    }

    inline void Flush()
    {
        if (idx)
        {
            fwrite(buf, 1, idx, stdout);
            idx = 0;
        }
    }

    inline void PutChar(char c)
    {
        if (idx >= BUFSZ)
        {
            Flush();
        }
        buf[idx++] = c;
    }

    inline void WriteInt(int v)
    {
        if (v == 0)
        {
            PutChar('0');
            return;
        }

        if (v < 0)
        {
            PutChar('-');
            v = -v;
        }

        char tmp[16];
        int n = 0;
        while (v > 0)
        {
            tmp[n++] = char('0' + (v % 10));
            v /= 10;
        }
        while (n--)
        {
            PutChar(tmp[n]);
        }
    }

    inline void WriteLnInt(int v)
    {
        WriteInt(v);
        PutChar('\n');
    }
};

int find(int x)

{
    int root = x;
    while (root != link[root])
    {
        root = link[root];
    }

    while (x != root)
    {
        int p = link[x];
        link[x] = root;
        x = p;
    }
    return root;
}

bool same(int a, int b)

{
    return (find(a) == find(b));
}

void unite(int a, int b)

{
    a = find(a);
    b = find(b);
    if (a == b)
    {
        return;
    }

    if (linkSize[a] < linkSize[b])
    {
        swap(a, b);
    }
    link[b] = a;
    linkSize[a] += linkSize[b];
}

static inline __int128 dis(pair<long long, long long> p1, pair<long long, long long> p2)

{
    long long dx = p1.first - p2.first;
    long long dy = p1.second - p2.second;
    return (__int128)dx * dx + (__int128)dy * dy;
}

int main(void)

{
    ios::sync_with_stdio(false);
    cin.tie(nullptr), cout.tie(nullptr);

    FastInput in;
    FastOutput out;

    int t;
    in.ReadInt(t);

    while (t--)
    {
        int n;
        in.ReadInt(n);

        vector<long long> r(n);
        vector<pair<long long, long long>> p(n);

        link.resize(n);
        linkSize.assign(n, 1);
        for (int i = 0; i < n; i++)
        {
            link[i] = i;
        }

        for (int i = 0; i < n; i++)
        {
            long long x, y, rr;
            in.ReadInt(x);
            in.ReadInt(y);
            in.ReadInt(rr);
            p[i] = {x, y};
            r[i] = rr;
        }

        for (int i = 0; i < n; i++)
        {
            const long long xi = p[i].first;
            const long long yi = p[i].second;
            const long long ri = r[i];

            for (int j = i + 1; j < n; j++)
            {
                long long dx = xi - p[j].first;
                long long dy = yi - p[j].second;

                __int128 dist2 = (__int128)dx * dx + (__int128)dy * dy;
                long long sum = ri + r[j];
                __int128 sum2 = (__int128)sum * sum;

                if (dist2 <= sum2)
                {
                    unite(i, j);
                }
            }
        }

        vector<char> seen(n, 0);
        int cnt = 0;
        for (int i = 0; i < n; i++)
        {
            int root = find(i);
            if (!seen[root])
            {
                seen[root] = 1;
                cnt++;
            }
        }

        out.WriteLnInt(cnt);
    }

    out.Flush();
    return 0;
}

#include <iostream>

static inline uint64_t Fnv1a64(const char* s)
{
    uint64_t h = 1469598103934665603ULL;
    while (*s)
    {
        h ^= static_cast<unsigned char>(*s);
        h *= 1099511628211ULL;
        s++;
    }
    return h;
}

static inline uint64_t ParseSeed(int argc, char* argv[])
{
    if (argc >= 2)
    {
        char* end = nullptr;
        unsigned long long v = strtoull(argv[1], &end, 10);
        if (end != nullptr && *end == '\0')
        {
            return static_cast<uint64_t>(v);
        }
        return Fnv1a64(argv[1]);
    }

    uint64_t t = static_cast<uint64_t>(
        chrono::high_resolution_clock::now().time_since_epoch().count()
    );
    uint64_t m = static_cast<uint64_t>(reinterpret_cast<uintptr_t>(&argc));
    return t ^ (m + 0x9e3779b97f4a7c15ULL);
}

class FastRng
{
private:
    uint64_t state;

    static inline uint64_t NextU64(uint64_t& x)
    {
        x += 0x9e3779b97f4a7c15ULL;
        uint64_t z = x;
        z = (z ^ (z >> 30)) * 0xbf58476d1ce4e5b9ULL;
        z = (z ^ (z >> 27)) * 0x94d049bb133111ebULL;
        return z ^ (z >> 31);
    }

public:
    explicit FastRng(uint64_t seed) : state(seed)
    {
    }

    inline uint64_t Next()
    {
        return NextU64(state);
    }

    inline int NextInt(int l, int r)
    {
        uint64_t range = static_cast<uint64_t>(static_cast<uint32_t>(r - l)) + 1ULL;
        uint64_t limit = UINT64_MAX - (UINT64_MAX % range);

        uint64_t x;
        do
        {
            x = Next();
        } while (x >= limit);

        return l + static_cast<int>(x % range);
    }
};

class FastOutput
{
private:
    static constexpr size_t BUFSZ = 1 << 20;
    char buf[BUFSZ];
    size_t idx;

public:

    {

    {

    {

    inline void WriteTripleLn(int a, int b, int c)
    {

static inline int ClampInt(int v, int lo, int hi)
{
    if (v < lo)
    {
        return lo;
    }
    if (v > hi)
    {
        return hi;
    }
    return v;
}

int main(int argc, char* argv[])

{
    ios::sync_with_stdio(false); cin.tie(nullptr), cout.tie(nullptr);

    uint64_t seed = ParseSeed(argc, argv);
    FastRng rnd(seed);
    FastOutput out;

    int T = rnd.NextInt(1, 5);
    out.WriteLnInt(T);

    for (int t = 0; t < T; t++)
    {
        int N = rnd.NextInt(1, 10);
        int K = rnd.NextInt(1, min(N, 3));
        int Rbound = rnd.NextInt(0, 1000);

        int sz[3] = {0, 0, 0};
        for (int i = 0; i < K; i++)
        {
            sz[i] = 1;
        }
        for (int i = 0; i < N - K; i++)
        {
            sz[rnd.NextInt(0, K - 1)]++;
        }

        int centersX[3];
        int centersY[3];

        // K <= 3 이므로 trig 없이 상수로 각도 배치(원래 코드와 동일한 배치)
        // i=0: (4500, 2500)
        // K=2, i=1: (500, 2500)
        // K=3, i=1: (1500, 4232), i=2: (1500, 768)  (2000*sin(120°)=1732 근사)
        if (K == 1)
        {
            centersX[0] = 4500;
            centersY[0] = 2500;
        }
        else if (K == 2)
        {
            centersX[0] = 4500; centersY[0] = 2500;
            centersX[1] = 500;  centersY[1] = 2500;
        }
        else
        {
            centersX[0] = 4500; centersY[0] = 2500;
            centersX[1] = 1500; centersY[1] = 4232;
            centersX[2] = 1500; centersY[2] = 768;
        }

        for (int i = 0; i < K; i++)
        {
            centersX[i] += rnd.NextInt(-100, 100);
            centersY[i] += rnd.NextInt(-100, 100);
            centersX[i] = ClampInt(centersX[i], 0, 5000);
            centersY[i] = ClampInt(centersY[i], 0, 5000);
        }

        Circle circles[10];
        int cnt = 0;

        for (int i = 0; i < K; i++)
        {
            int x = centersX[i];
            int y = centersY[i];
            for (int j = 0; j < sz[i]; j++)
            {
                int r = rnd.NextInt(0, Rbound);
                circles[cnt++] = {x, y, r};
            }
        }

        // Fisher–Yates shuffle
        for (int i = cnt - 1; i >= 1; i--)
        {
            int j = rnd.NextInt(0, i);
            swap(circles[i], circles[j]);
        }

        out.WriteLnInt(N);
        for (int i = 0; i < cnt; i++)
        {
            out.WriteTripleLn(circles[i].x, circles[i].y, circles[i].r);
        }
    }

    out.Flush();
    return 0;
}

#include <iostream>

#include <algorithm>
#include <tuple>

using namespace std;

pair<long long, long long> operator + (pair<long long, long long> a, pair<long long, long long> b)
{
	return { a.first + b.first, a.second + b.second };
}

pair<long long, long long> operator - (pair<long long, long long> a, pair<long long, long long> b)
{
	return { a.first - b.first, a.second - b.second };
}

long long dis(pair<long long, long long> a, pair<long long, long long> b)
{
	return (a.first - b.first) * (a.first - b.first) + (a.second - b.second) * (a.second - b.second);
}

int ccw(pair<long long, long long> a, pair<long long, long long> b, pair<long long, long long> c)
{
	long long s;
	s = a.first * b.second + b.first * c.second + c.first * a.second - a.second * b.first - b.second * c.first - c.second * a.first;
	if (s > 0)
		return 1;
	else if (s < 0)
		return -1;
	else
		return 0;
}

int main(void)
{
	ios::sync_with_stdio(false);
	cin.tie(NULL), cout.tie(NULL);
	int n;
	cin >> n;
	vector<pair<long long, long long>> p(n);
	vector<pair<long long, long long>> u;
	vector<pair<long long, long long>> l;
	for (int i = 0; i < n; i++)
		cin >> p[i].first >> p[i].second;
	sort(p.begin(), p.end());
	u.push_back(p[0]);
	u.push_back(p[1]);
	l.push_back(p[n - 1]);
	l.push_back(p[n - 2]);
	for (int i = 2; i < n; i++)
	{
		for (int j = u.size(); j >= 2 && ccw(u[j - 2], u[j - 1], p[i]) != 1; j--)
			u.pop_back();
		u.push_back(p[i]);
	}
	for (int i = p.size() - 3; i >= 0; i--)
	{
		for (int j = l.size(); j >= 2 && ccw(l[j - 2], l[j - 1], p[i]) != 1; j--)
			l.pop_back();
		l.push_back(p[i]);
	}
	reverse(u.begin(), u.end());
	for (int i = l.size() - 2; i >= 1; i--)
		u.push_back(l[i]);
	int r = 0;
	long long ans = 0;
	n = u.size();
	for (int i = 0; i < n; i++)
	{
		while (r < n * 2 && ccw(u[i], u[(i + 1) % n], u[(i + 1) % n] + u[(r + 1) % n] - u[r % n]) != 1)
		{
			ans = max(ans, dis(u[i], u[r % n]));
			r++;
		}
		ans = max(ans, dis(u[i], u[r % n]));
	}
	cout << ans;
	return 0;
}

#include <iostream>
#include <vector>
#include <string>
#include <charconv>
#include <cstdio>
#include <chrono>
#include <cstdlib>

using namespace std;

static const int COORD_MIN = -50000;
static const int COORD_MAX =  50000;

struct SplitMix64
{
    unsigned long long x;

    explicit SplitMix64(unsigned long long seed) : x(seed) {}

    unsigned long long NextU64()
    {
        unsigned long long z = (x += 0x9e3779b97f4a7c15ULL);
        z = (z ^ (z >> 30)) * 0xbf58476d1ce4e5b9ULL;
        z = (z ^ (z >> 27)) * 0x94d049bb133111ebULL;
        return z ^ (z >> 31);
    }

    unsigned int NextU32()
    {
        return (unsigned int)(NextU64() >> 32);
    }

    // [0, bound) (bound > 0)
    unsigned int Bounded(unsigned int bound)
    {
        // (rand32 * bound) >> 32  : 빠르고 편향이 매우 작음(테스트케이스 생성 용도로 충분)
        return (unsigned int)(((unsigned long long)NextU32() * (unsigned long long)bound) >> 32);
    }

    // [lo, hi]
    int NextInt(int lo, int hi)
    {
        unsigned int span = (unsigned int)(hi - lo + 1);
        return lo + (int)Bounded(span);
    }
};

static inline void AppendInt(string &out, int v)
{
    char buf[32];
    auto res = to_chars(buf, buf + 32, v);
    out.append(buf, res.ptr);
}

int main(int argc, char* argv[])
{
    ios::sync_with_stdio(false);
    cin.tie(nullptr);
    cout.tie(nullptr);

    unsigned long long seed =
        (unsigned long long)chrono::high_resolution_clock::now().time_since_epoch().count();
    if (argc >= 2)
    {
        seed = strtoull(argv[1], nullptr, 10);
    }

    SplitMix64 rng(seed);

    int n = (argc >= 3) ? (int)strtol(argv[2], nullptr, 10) : rng.NextInt(1, 100000);
    if (n < 1)
    {
        n = 1;
    }
    if (n > 100000)
    {
        n = 100000;
    }

    // mode:
    // 0: 균등 랜덤
    // 1: 클러스터 + 아웃라이어
    // 2: 거의 직선
    // 3: 코너 근처
    int mode = (argc >= 4) ? (int)strtol(argv[3], nullptr, 10) : rng.NextInt(0, 3);
    if (mode < 0 || mode > 3)
    {
        mode = rng.NextInt(0, 3);
    }

    vector<pair<int, int>> pts;
    pts.resize((size_t)n);

    if (mode == 0)
    {
        for (int i = 0; i < n; i++)
        {
            int x = rng.NextInt(COORD_MIN, COORD_MAX);
            int y = rng.NextInt(COORD_MIN, COORD_MAX);
            pts[(size_t)i] = {x, y};
        }
    }
    else if (mode == 1)
    {
        int cx = rng.NextInt(COORD_MIN, COORD_MAX);
        int cy = rng.NextInt(COORD_MIN, COORD_MAX);
        int r = rng.NextInt(50, 5000);

        int outliers = n / 50;
        if (outliers < 1)
        {
            outliers = 1;
        }
        if (outliers > n)
        {
            outliers = n;
        }

        int i = 0;
        for (; i < outliers; i++)
        {
            int x = rng.NextInt(COORD_MIN, COORD_MAX);
            int y = rng.NextInt(COORD_MIN, COORD_MAX);
            pts[(size_t)i] = {x, y};
        }
        for (; i < n; i++)
        {
            int x = cx + rng.NextInt(-r, r);
            int y = cy + rng.NextInt(-r, r);
            if (x < COORD_MIN) x = COORD_MIN;
            if (x > COORD_MAX) x = COORD_MAX;
            if (y < COORD_MIN) y = COORD_MIN;
            if (y > COORD_MAX) y = COORD_MAX;
            pts[(size_t)i] = {x, y};
        }
    }
    else if (mode == 2)
    {
        int x0 = rng.NextInt(COORD_MIN, COORD_MAX);
        int y0 = rng.NextInt(COORD_MIN, COORD_MAX);

        int vx = rng.NextInt(-1000, 1000);
        int vy = rng.NextInt(-1000, 1000);
        if (vx == 0 && vy == 0)
        {
            vx = 1;
        }

        int noise = rng.NextInt(0, 30);

        for (int i = 0; i < n; i++)
        {
            int t = rng.NextInt(-100000, 100000);
            long long x = (long long)x0 + (long long)vx * (long long)t;
            long long y = (long long)y0 + (long long)vy * (long long)t;

            if (noise != 0)
            {
                x += rng.NextInt(-noise, noise);
                y += rng.NextInt(-noise, noise);
            }

            if (x < COORD_MIN) x = COORD_MIN;
            if (x > COORD_MAX) x = COORD_MAX;
            if (y < COORD_MIN) y = COORD_MIN;
            if (y > COORD_MAX) y = COORD_MAX;

            pts[(size_t)i] = {(int)x, (int)y};
        }
    }
    else
    {
        // corners
        const int cornersX[4] = {COORD_MIN, COORD_MIN, COORD_MAX, COORD_MAX};
        const int cornersY[4] = {COORD_MIN, COORD_MAX, COORD_MIN, COORD_MAX};

        int jitter = rng.NextInt(0, 2000);

        for (int i = 0; i < n; i++)
        {
            int idx = rng.NextInt(0, 3);
            int x = cornersX[idx] + rng.NextInt(-jitter, jitter);
            int y = cornersY[idx] + rng.NextInt(-jitter, jitter);

            if (x < COORD_MIN) x = COORD_MIN;
            if (x > COORD_MAX) x = COORD_MAX;
            if (y < COORD_MIN) y = COORD_MIN;
            if (y > COORD_MAX) y = COORD_MAX;

            pts[(size_t)i] = {x, y};
        }
    }

    // 빠른 출력: string 버퍼에 모두 쌓아 한 번에 fwrite
    string out;
    out.reserve((size_t)n * 24 + 32);

    AppendInt(out, n);
    out.push_back('\n');

    for (int i = 0; i < n; i++)
    {
        AppendInt(out, pts[(size_t)i].first);
        out.push_back(' ');
        AppendInt(out, pts[(size_t)i].second);
        out.push_back('\n');
    }

    fwrite(out.data(), 1, out.size(), stdout);
    return 0;
}
